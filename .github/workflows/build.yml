name: build
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: unzip -q full-end-b-source.zip
      - run: |
          cd full-end-a
          pip install -r requirements.txt
          chmod +x build.sh
          ./build.sh setup
          ./build.sh pack
      - uses: actions/upload-artifact@v4
        with:
          name: full-end-b-mcpack
          path: full-end-b/build/*
