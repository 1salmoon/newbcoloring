name: build-sun-fix

# Build cepat untuk kalibrasi posisi glow langit vs matahari.
# Actions -> build-sun-fix -> Run workflow, isi nilai, download artifact .mcpack,
# tes di game, ulangi sampai pas.
on:
  workflow_dispatch:
    inputs:
      sun_yaw:
        description: 'NL_SUN_PATH_YAW (derajat, 0 = vanilla)'
        default: '0.0'
      sun_tilt:
        description: 'NL_SUN_PATH_TILT (derajat, 0 = vanilla)'
        default: '0.0'
      glow_offset:
        description: 'NL_SUN_GLOW_YAW_OFFSET (derajat, +/- membalik arah geser)'
        default: '0.0'
      subversion:
        description: 'Sub-version (eg: 46)'
        default: '1'
      platform:
        description: 'Target platform'
        default: 'android'
        type: choice
        options:
        - android
        - ios
        - windows
        - multiplatform

jobs:
  build:
    # windows/multiplatform memakai runner Windows seperti build.yml bawaan repo
    runs-on: ${{ (inputs.platform == 'windows' || inputs.platform == 'multiplatform') && 'windows-2022' || 'ubuntu-latest' }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
        cache: 'pip'
    - uses: actions/cache@v6
      with:
        key: env-files-${{ (inputs.platform == 'windows' || inputs.platform == 'multiplatform') && 'win' || 'linux' }}-laz
        path: |
          ${{ github.workspace }}/tool/data

    - name: Terapkan nilai kalibrasi ke config.h
      shell: bash
      run: |
        f=src/newb/config.h
        sed -i -E "s/^(#define NL_SUN_PATH_YAW)[[:space:]]+[^ ]+/\1 ${{ inputs.sun_yaw }}/" $f
        sed -i -E "s/^(#define NL_SUN_PATH_TILT)[[:space:]]+[^ ]+/\1 ${{ inputs.sun_tilt }}/" $f
        sed -i -E "s/^(#define NL_SUN_GLOW_YAW_OFFSET)[[:space:]]+[^ ]+/\1 ${{ inputs.glow_offset }}/" $f
        grep -nE "^#define NL_(SUN_PATH|SUN_GLOW)" $f

    - run: pip install -r requirements.txt

    - name: Build (Linux)
      if: ${{ inputs.platform == 'android' || inputs.platform == 'ios' }}
      run: |
        ./build.sh setup
        ./build.sh pack -p ${{ inputs.platform }} -v ${{ inputs.subversion }} --no-zip

    - name: Build (Windows)
      if: ${{ inputs.platform == 'windows' || inputs.platform == 'multiplatform' }}
      run: |
        .\build.bat setup
        .\build.bat pack -p ${{ inputs.platform }} -v ${{ inputs.subversion }} --no-zip

    - name: Zip jadi .mcpack
      shell: bash
      run: |
        python -c "import shutil; shutil.make_archive('newb-sunfix-${{ inputs.platform }}', 'zip', 'build/pack-${{ inputs.platform }}')"
        mv newb-sunfix-${{ inputs.platform }}.zip newb-sunfix-${{ inputs.platform }}.mcpack

    - uses: actions/upload-artifact@v4
      with:
        name: newb-sunfix-${{ inputs.platform }}
        path: newb-sunfix-${{ inputs.platform }}.mcpack
